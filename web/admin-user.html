<style>
.user-page {
  max-width: 900px;
  margin: 0 auto;
}
.user-page h2 {
  font-size: 1.3em;
  margin: 2em 0 .6em;
  color: var(--color-text-muted);
  font-weight: normal;
}
.user-card {
  border: 1px solid var(--color-border-ui);
  padding: 1em;
  display: flex;
  flex-wrap: wrap;
  gap: 1em;
  align-items: center;
  justify-content: space-between;
}
.user-card strong {
  font-size: 1.2em;
}
.user-card .role {
  font-size: .8em;
  border: 1px solid var(--color-border-ui);
  padding: .1em .5em;
}
.user-card .role.admin {
  color: var(--color-success);
  border-color: currentColor;
}
.admin-actions {
  display: flex;
  gap: .5em;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 1em;
}
.admin-actions select {
  background: var(--color-surface);
  color: var(--color-text);
  border: 1px solid var(--color-border-ui);
  padding: .4em;
}
button, .button {
  background: var(--color-surface);
  border: 1px solid var(--color-border-ui);
  color: var(--color-text);
  cursor: pointer;
  padding: .4em .8em;
  text-decoration: none;
  display: inline-block;
}
button:hover, .button:hover {
  background: var(--color-border);
}
button.danger {
  color: var(--color-error);
  border-color: currentColor;
}
.proxy {
  border-bottom: 1px solid var(--color-border);
  padding: .9em 0;
}
.proxy-main {
  display: flex;
  flex-wrap: wrap;
  gap: .3em 1em;
  align-items: baseline;
}
.proxy-main a {
  font-weight: bold;
  word-break: break-all;
}
.proxy-main code {
  font-size: .85em;
  word-break: break-all;
}
.proxy-meta {
  color: var(--color-text-muted);
  font-size: .8em;
  margin-top: .3em;
}
.proxy-actions {
  display: flex;
  gap: .4em;
  margin-top: .5em;
}
.muted { color: var(--color-text-muted); }
</style>

<p class="hero">
  <strong>/admin/<!--# echo var="rg_view_user" --></strong>
  <span class="desc">
    <!--# if expr="$rg_is_self = /1/" -->Your user space.<!--# endif -->
    <!--# if expr="$rg_is_self = /0/" -->Admin view for this user.<!--# endif -->
  </span>
</p>

<div class="user-page">
  <div class="user-card">
    <div>
      <strong><!--# echo var="rg_view_user" --></strong>
      <span class="role <!--# if expr="$rg_view_role = /admin/" -->admin<!--# endif -->" id="role-badge">
        <!--# echo var="rg_view_role" -->
      </span>
    </div>
    <div class="actions">
      <a class="button" href="/">Dashboard</a>
      <!--# if expr="$rg_role = /admin/" -->
      <a class="button" href="/admin">Back to admin</a>
      <!--# endif -->
    </div>
  </div>

  <!--# if expr="$rg_is_self = /0/" -->
  <!--# if expr="$rg_role = /admin/" -->
  <div class="admin-actions" id="admin-actions">
    <label for="role-select">Role</label>
    <select id="role-select">
      <option value="user">user</option>
      <option value="admin">admin</option>
    </select>
    <button id="role-save" type="button">save</button>
    <button id="user-delete" type="button" class="danger">delete user</button>
    <span id="admin-status" class="muted"></span>
  </div>
  <!--# endif -->
  <!--# endif -->

  <h2>Short links</h2>
  <div id="proxy-list">
    <p class="muted">Loading…</p>
  </div>
</div>

<script>
const TARGET = '<!--# echo var="rg_view_user" -->';
const SELF = '<!--# echo var="rg_is_self" -->' === '1';
const VIEWER_ROLE = '<!--# echo var="rg_role" -->';
const listEl = document.getElementById('proxy-list');
const roleBadge = document.getElementById('role-badge');
const roleSelect = document.getElementById('role-select');
const roleSave = document.getElementById('role-save');
const userDelete = document.getElementById('user-delete');
const adminStatus = document.getElementById('admin-status');

const setStatus = (value) => {
  if (adminStatus) adminStatus.textContent = value || '';
};

const formatDate = value => {
  if (!value) return '';
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? '' : date.toLocaleString();
};

const api = async (path, options = {}) => {
  const response = await fetch(path, {
    ...options,
    headers: { Accept: 'application/json', ...(options.headers || {}) },
  });
  if (response.status === 401) {
    location.href = '/login';
    throw new Error('unauthorized');
  }
  if (response.status === 403) {
    location.href = '/';
    throw new Error('forbidden');
  }
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || 'request failed');
  return data;
};

const renderProxies = proxies => {
  listEl.replaceChildren();

  if (!proxies.length) {
    const empty = document.createElement('p');
    empty.className = 'muted';
    empty.textContent = 'No short links yet.';
    listEl.append(empty);
    return;
  }

  for (const proxy of proxies) {
    const row = document.createElement('div');
    row.className = 'proxy';

    const main = document.createElement('div');
    main.className = 'proxy-main';

    const link = document.createElement('a');
    link.href = proxy.shortUrl;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = proxy.shortUrl;

    const code = document.createElement('code');
    code.textContent = proxy.url;

    main.append(link, code);

    const meta = document.createElement('div');
    meta.className = 'proxy-meta';
    meta.textContent = [
      proxy.isCdn ? 'production' : 'development',
      formatDate(proxy.createdAt),
    ].filter(Boolean).join(' · ');

    row.append(main, meta);
    listEl.append(row);
  }
};

const load = async () => {
  try {
    if (SELF) {
      const data = await api('/api/proxies');
      renderProxies(data.proxies || []);
      return;
    }

    const data = await api('/api/admin/users/' + encodeURIComponent(TARGET));
    const role = data.user.role || 'user';
    roleBadge.textContent = role;
    roleBadge.className = 'role' + (role === 'admin' ? ' admin' : '');
    if (roleSelect) roleSelect.value = role;
    renderProxies(data.proxies || []);
  } catch (error) {
    listEl.replaceChildren();
    const message = document.createElement('p');
    message.className = 'muted';
    message.textContent = 'Could not load this user.';
    listEl.append(message);
  }
};

if (roleSave) {
  roleSave.addEventListener('click', async () => {
    setStatus('');
    roleSave.disabled = true;
    try {
      await api('/api/admin/users/' + encodeURIComponent(TARGET), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role: roleSelect.value }),
      });
      setStatus('saved');
      load();
    } catch (error) {
      setStatus(error.message);
    } finally {
      roleSave.disabled = false;
    }
  });
}

if (userDelete) {
  userDelete.addEventListener('click', async () => {
    if (!confirm('Delete user ' + TARGET + ' and all their short links?')) return;
    userDelete.disabled = true;
    try {
      await api('/api/admin/users/' + encodeURIComponent(TARGET), { method: 'DELETE' });
      location.href = '/admin';
    } catch (error) {
      setStatus(error.message);
      userDelete.disabled = false;
    }
  });
}

load();
</script>
