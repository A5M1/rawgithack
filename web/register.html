<!--# set var="title" value="Create account" -->
<!--# set var="description" value="${rg_site_name} - create account" -->

<!--# include file="internal/pre.html" -->

<style>
.register {
  max-width: 420px;
  margin: 0 auto;
}
.register .field {
  display: block;
  margin: 1em 0;
}
.register .field span {
  display: block;
  color: var(--color-text-muted);
  font-size: .9em;
  margin-bottom: .3em;
}
.register input {
  box-sizing: border-box;
  width: 100%;
  padding: .7em;
  border: 1px solid var(--color-border-ui);
  background: var(--color-surface);
  color: var(--color-text);
}
.register button {
  width: 100%;
  padding: .8em;
  font-size: 1em;
}
.register-error {
  color: var(--color-error);
  text-align: center;
}
</style>

<p class="hero">
  <strong>Create account</strong>
  <span class="desc">This secret registration link can only be used once.</span>
</p>

<div class="register">
  <!--# if expr="$error = /.+/" -->
  <p class="register-error"><!--# echo var="error" --></p>
  <!--# endif -->

  <form method="POST" action="">
    <label class="field">
      <span>Username</span>
      <input name="username" autocomplete="username" required autofocus>
    </label>

    <label class="field">
      <span>Password</span>
      <input name="password" type="password" autocomplete="new-password" minlength="8" required>
    </label>

    <label class="field">
      <span>Confirm password</span>
      <input name="confirm" type="password" autocomplete="new-password" minlength="8" required>
    </label>

    <button type="submit" class="url-action-button">Create account</button>
  </form>
</div>

<!--# include file="internal/post.html" -->
