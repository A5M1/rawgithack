<!--# set var="title" value="Account recovery" -->
<!--# set var="description" value="${rg_site_name} - account recovery" -->

<!--# include file="internal/pre.html" -->

<style>
.recover {
  max-width: 460px;
  margin: 0 auto;
}
.recover .field {
  display: block;
  margin: 1em 0;
}
.recover .field span {
  display: block;
  color: var(--color-text-muted);
  font-size: .9em;
  margin-bottom: .3em;
}
.recover input {
  box-sizing: border-box;
  width: 100%;
  padding: .7em;
  border: 1px solid var(--color-border-ui);
  background: var(--color-surface);
  color: var(--color-text);
}
.recover button {
  width: 100%;
  min-height: 44px;
}
.recover .error {
  color: var(--color-error);
  text-align: center;
}
.recover .notice {
  color: var(--color-text-muted);
  text-align: center;
}
</style>

<p class="hero">
  <strong>Account recovery</strong>
  <span class="desc">Use one of your saved recovery codes to reset your password.</span>
</p>

<div class="recover">
  <!--# if expr="$error = /.+/" -->
  <p class="error"><!--# echo var="error" --></p>
  <!--# endif -->
  <!--# if expr="$notice = /.+/" -->
  <p class="notice"><!--# echo var="notice" --></p>
  <!--# endif -->

  <form method="POST" action="/recover">
    <label class="field">
      <span>Username</span>
      <input name="username" autocomplete="username" required autofocus>
    </label>

    <label class="field">
      <span>Recovery code</span>
      <input name="code" autocomplete="off" autocapitalize="characters"
             spellcheck="false" placeholder="XXXX-XXXX-XXXX" required>
    </label>

    <label class="field">
      <span>New password</span>
      <input name="password" type="password" autocomplete="new-password" minlength="8" required>
    </label>

    <label class="field">
      <span>Confirm new password</span>
      <input name="confirm" type="password" autocomplete="new-password" minlength="8" required>
    </label>

    <button type="submit" class="url-action-button">Reset password</button>
  </form>

  <p style="text-align: center; color: var(--color-text-muted); margin-top: 1.2em;">
    <a href="/login">Back to sign in</a>
  </p>
</div>

<!--# include file="internal/post.html" -->
