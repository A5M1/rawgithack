<style>
.app {
  max-width: 1100px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 190px minmax(0, 1fr);
  gap: 2em;
}
.side {
  border-right: 1px solid var(--color-border);
  padding-right: 1em;
  align-self: start;
}
.side-link {
  display: block;
  padding: .55em .7em;
  margin: .15em 0;
  color: var(--color-text);
  text-decoration: none;
  border-left: 2px solid transparent;
}
.side-link:hover {
  background: var(--color-surface);
}
.side-link.active {
  border-left-color: var(--color-link);
  color: var(--color-link);
  background: var(--color-surface);
}
.side-heading {
  margin: 1.4em .7em .4em;
  color: var(--color-text-muted);
  font-size: .75em;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.view {
  min-width: 0;
}
.view h1 {
  font-size: 2em;
  margin: .2em 0 .1em;
}
.view h2 {
  font-size: 1.25em;
  margin: 2em 0 .6em;
  color: var(--color-text-muted);
  font-weight: normal;
}
.lead {
  color: var(--color-text-muted);
  margin: 0 0 1.5em;
}
.create-box {
  border: 1px solid var(--color-border-ui);
  background: var(--color-surface);
}
.create-row {
  display: flex;
}
.create-row select {
  border: none;
  border-left: 1px solid var(--color-border-ui);
  background: var(--color-surface);
  color: var(--color-text);
  padding: 0 .5em;
}
.create-row .url-action-button {
  border-left: 1px solid var(--color-border-ui);
}
.create-custom {
  display: flex;
  align-items: center;
  border-top: 1px solid var(--color-border-ui);
}
.create-custom .prefix {
  color: var(--color-text-muted);
  padding-left: .8em;
  white-space: nowrap;
}
.create-custom .url,
.create-result .url {
  background: transparent;
}
.create-result {
  display: flex;
  border-top: 1px solid var(--color-border-ui);
}
.error {
  color: var(--color-error);
  min-height: 1.5em;
  margin: .5em 0;
}
.muted { color: var(--color-text-muted); }
.row {
  border-bottom: 1px solid var(--color-border);
  padding: .9em 0;
}
.row-main {
  display: flex;
  flex-wrap: wrap;
  gap: .3em 1em;
  align-items: baseline;
}
.row-main a {
  font-weight: bold;
  word-break: break-all;
}
.row-main code {
  font-size: .85em;
  word-break: break-all;
}
.row-meta {
  color: var(--color-text-muted);
  font-size: .8em;
  margin-top: .3em;
}
.row-actions {
  display: flex;
  flex-wrap: wrap;
  gap: .4em;
  margin-top: .5em;
}
.btn {
  background: var(--color-surface);
  border: 1px solid var(--color-border-ui);
  color: var(--color-text);
  cursor: pointer;
  padding: .38em .75em;
  text-decoration: none;
  display: inline-block;
}
.btn:hover { background: var(--color-border); }
.btn.danger { color: var(--color-error); border-color: currentColor; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  text-align: left;
  padding: .65em .4em;
  border-bottom: 1px solid var(--color-border);
  vertical-align: middle;
}
th {
  color: var(--color-text-muted);
  font-weight: normal;
  font-size: .85em;
}
.role {
  display: inline-block;
  font-size: .8em;
  border: 1px solid var(--color-border-ui);
  padding: .1em .5em;
}
.role.admin { color: var(--color-success); border-color: currentColor; }
.toolbar {
  display: flex;
  gap: .5em;
}
.toolbar input {
  flex: 1;
  border: 1px solid var(--color-border-ui);
  background: var(--color-surface);
  color: var(--color-text);
  padding: .5em;
}
.card {
  border: 1px solid var(--color-border-ui);
  padding: 1em;
  display: flex;
  gap: 1em;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
}
.card strong { font-size: 1.15em; }
.card-actions { display: flex; gap: .5em; flex-wrap: wrap; }
.card-actions select {
  background: var(--color-surface);
  color: var(--color-text);
  border: 1px solid var(--color-border-ui);
  padding: .4em;
}
@media (max-width: 760px) {
  .app {
    display: block;
  }
  .side {
    border-right: none;
    border-bottom: 1px solid var(--color-border);
    padding: 0 0 .6em;
    margin-bottom: 1.2em;
    display: flex;
    flex-wrap: wrap;
    gap: .2em;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .side-link { border-left: none; border-bottom: 2px solid transparent; white-space: nowrap; }
  .side-link.active { border-left: none; border-bottom-color: var(--color-link); }
  .side-heading { display: none; }
  .view h1 { font-size: 1.6em; overflow-wrap: anywhere; }
  .toolbar { flex-wrap: wrap; }
  .toolbar input { flex: 1 1 100%; }
  .toolbar .btn { flex: 1 1 auto; }
  #users,
  #invite-list { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #users table,
  #invite-list table { min-width: 520px; }
  .card { align-items: flex-start; }
  .card-actions,
  .row-actions { width: 100%; }
  .card-actions .btn,
  .row-actions .btn { flex: 1 1 auto; text-align: center; }
  .create-row { flex-direction: column; }
}
</style>

<div class="app">
  <aside class="side">
    <a class="side-link" data-route="/dashboard/links" href="/dashboard/links">Links</a>
    <a class="side-link" data-route="/dashboard/account" href="/dashboard/account">Account</a>
    <!--# if expr="$rg_role = /admin/" -->
    <div class="side-heading">Admin</div>
    <a class="side-link" data-route="/dashboard/users" href="/dashboard/users">Users</a>
    <a class="side-link" data-route="/dashboard/invites" href="/dashboard/invites">Invites</a>
    <!--# endif -->
  </aside>

  <main class="view" id="view"
        data-viewer="<!--# echo var="rg_user" -->"
        data-role="<!--# echo var="rg_role" -->">
    <p class="muted">Loading…</p>
  </main>
</div>

<script src="/assets/dashboard.js" defer></script>
